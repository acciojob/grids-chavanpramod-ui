<!DOCTYPE html>
<html>

<head>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<div class="container" style="width: 600px; border: 5px solid rgb(4, 255, 4); background-color: rgb(41, 0, 0);">
		<!-- Row 1 -->
		<div class="row" style="border: 5px solid rgb(255, 188, 188); height: 200px;">
			<div class="col-6 col-md-4" style="background-color: teal; border: 2px dotted rgb(38, 38, 43);">Row1 col1</div>
			<div class="col-6 col-md-8" style="background-color: thistle; border: 2px dotted rgb(38, 38, 43);">Row1 col2</div>
		</div>

		<!-- Row 2 -->
		<div class="row justify-content-between" style="border: 5px solid rgb(255, 188, 188); height: 200px;">
			<div class="col-md-4 offset-md-2" style="background-color: tomato; border: 2px dotted rgb(38, 38, 43);">Row2 col1</div>
			<div class="col-md-4" style="background-color: turquoise; border: 2px dotted rgb(38, 38, 43);">Row2 col2</div>
		</div>

		<!-- Row 3 -->
		<div class="row justify-content-center" style="border: 5px solid rgb(255, 188, 188); height: 200px;">
			<div class="col-6 col-md-4" style="background-color: violet; border: 2px dotted rgb(38, 38, 43);">Row3 col1</div>
			<div class="col-6 col-md-4" style="background-color: yellowgreen; border: 2px dotted rgb(38, 38, 43);">Row3 col2</div>
		</div>
	</div>

	<script type="text/javascript" src="./script.js"></script>
</body>

</html>
